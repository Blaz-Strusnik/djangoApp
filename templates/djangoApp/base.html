<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap3@3.3.5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-default">
  <div class="container-fluid">
    <div class="navbar-header">
      <a class="navbar-brand" href="#">DjangoApp</a>
    </div>
    <ul class="nav navbar-nav">

      <li><a class="navbar-link" href="{% url 'admin:index' %}">Admin</a></li>
      <li><a class="navbar-link" href="{% url 'djangoApp:register' %}">Register</a></li>
    
    {% if user.is_authenticated %}
        <li><a class="navbar-link" href="{% url 'djangoApp:logout' %}">Logout</a></li>
    {% else %}
        <li><a class="navbar-link" href="{% url 'djangoApp:user_login' %}">Login</a></li>
    {% endif %}

    </ul>
  </div>
</nav>
<div class="container">
    {% block body_block %}
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap3@3.3.5/dist/js/bootstrap.min.js"></script>
</body>
</html>
