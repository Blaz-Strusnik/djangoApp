{% extends "djangoApp/djangoApp_base.html" %}
{% load static %}

{% block body_block %}

  <div class="jumbotron">
    {% if not form.instance.pk %}
      <h1>Create School</h1>
    {% else %}
      <h1>Update New School</h1>
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>

{% endblock %}
